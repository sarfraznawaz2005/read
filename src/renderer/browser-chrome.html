<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Read!</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: -apple-system, 'Segoe UI', Inter, system-ui, sans-serif;
        background: #1e293b;
      }
      #toolbar {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 40px;
        padding: 0 8px;
        background: #1e293b;
        border-bottom: 1px solid #334155;
      }
      button {
        background: #334155;
        color: #e2e8f0;
        border: none;
        border-radius: 6px;
        width: 28px;
        height: 28px;
        cursor: pointer;
        font-size: 13px;
        flex-shrink: 0;
      }
      button:disabled {
        opacity: 0.35;
        cursor: default;
      }
      button:not(:disabled):hover {
        background: #475569;
      }
      #url {
        flex: 1;
        height: 26px;
        border-radius: 6px;
        border: 1px solid #334155;
        background: #0f172a;
        color: #94a3b8;
        font-size: 12px;
        padding: 0 8px;
        display: flex;
        align-items: center;
        overflow: hidden;
        min-width: 0;
      }
      #url-text {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #spinner {
        width: 11px;
        height: 11px;
        border: 2px solid #475569;
        border-top-color: #818cf8;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        display: none;
        flex-shrink: 0;
        margin-right: 6px;
      }
      #spinner.loading {
        display: inline-block;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="toolbar">
      <button id="back" title="Back">←</button>
      <button id="forward" title="Forward">→</button>
      <button id="reload" title="Reload">⟳</button>
      <div id="url"><span id="spinner"></span><span id="url-text">Loading…</span></div>
      <button id="copy" title="Copy Link">🔗</button>
      <button id="external" title="Open in system browser">🌐</button>
      <button id="close" title="Close">✕</button>
    </div>
    <script type="module" src="/src/browserChrome.ts"></script>
  </body>
</html>
